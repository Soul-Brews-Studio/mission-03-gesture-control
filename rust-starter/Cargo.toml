[package]
name = "gesture-globe"
version = "0.1.0"
edition = "2021"
description = "Gesture-controlled 3D globe in Rust - Level 3 Challenge"

[dependencies]
# MQTT client (async)
rumqttc = "0.24"

# Async runtime
tokio = { version = "1", features = ["full"] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI args
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Window/canvas (Option 1: Simple framebuffer)
minifb = "0.27"

# 3D math
glam = "0.25"

# Random for lightning
rand = "0.8"

# Alternative: Bevy game engine (Option 2: Full 3D)
# Uncomment to use Bevy instead of minifb:
# bevy = "0.15"
